<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://fonts.googleapis.com/css?family=Geist:100,200,300,regular,500,600,700,800,900"
      rel="stylesheet"
    />
  </head>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      padding: 0;
      margin: 0;
      height: 100vh;
    }
    .container {
      display: flex;
      gap: 20px;
      background-color: white;
      height: 200px;
    }

    .box {
      background: #4f46e5;
      color: white;
      padding: 20px;
      border-radius: 8px;
      color: black;
      flex-basis: 0;
      width: 200px;
      height: 100px; 
    }

    .box-1 {
      flex-grow: 1;
      background-color: rgb(179, 248, 225);
    }

    .box-2 {
      flex-grow: 2;
      background-color: palevioletred;
    }
    .box-3 {
      flex-grow: 1;
      align-self: flex-end;
    }
  </style>
  <body style="font-family: Geist">
    <div class="container">
      <div class="box box-1">Column 1</div>
      <div class="box box-2">Column 2</div>
      <div class="box box-3">Column 3</div>
    </div>
  </body>
</html>
